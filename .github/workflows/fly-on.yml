# Allume la machine Fly (1 seule machine).
# Par défaut : arrêt automatique quand il n'y a plus de visites, redémarrage
# automatique à la visite suivante (API moobilPay).
# Option « permanent » : la machine ne s'arrête jamais.
# Lancement : onglet Actions > « Fly — allumer » > Run workflow.
# Secret requis : FLY_API_TOKEN (fly tokens create deploy -a netflix-automation).
name: Fly — allumer

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redéployer aussi le code de la branche choisie avant d'allumer"
        type: boolean
        default: false
      permanent:
        description: "Ne jamais s'arrêter (sinon arrêt auto sans visites)"
        type: boolean
        default: false

concurrency: fly-machine-control

env:
  FLY_APP: netflix-automation
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  on:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Déployer (optionnel)
        if: ${{ inputs.deploy }}
        run: flyctl deploy --remote-only --ha=false -a "$FLY_APP"

      - name: Garder une seule machine
        run: flyctl scale count 1 -a "$FLY_APP" --yes

      - name: Régler l'arrêt auto puis démarrer
        run: |
          if [ "${{ inputs.permanent }}" = "true" ]; then stop=off; else stop=stop; fi
          ids=$(flyctl machine list -a "$FLY_APP" --json | jq -r '.[].id')
          if [ -z "$ids" ]; then echo "Aucune machine : lancer avec deploy=true." >&2; exit 1; fi
          for id in $ids; do
            flyctl machine update "$id" -a "$FLY_APP" --autostop=$stop --autostart=true --yes
            flyctl machine start "$id" -a "$FLY_APP" || true
          done

      - name: État final
        run: flyctl machine list -a "$FLY_APP"
